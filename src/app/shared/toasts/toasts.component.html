<div class="toast-container position-fixed top-0 end-0 p-3 mt-5">
  <div class="toast show align-items-center border-0" role="alert"
    *ngFor="let toast of toastService.toasts"
    [ngClass]="'text-bg-' + toast.type">
    <div class="d-flex">
      <div class="toast-body">
        <i class="bi me-2" [ngClass]="toast.type === 'danger' ? 'bi-exclamation-triangle-fill' : 'bi-check-circle-fill'"></i>
        {{ toast.message }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close"
        (click)="toastService.remove(toast.id)"></button>
    </div>
  </div>
</div>
